
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link rel="stylesheet" href="inventory.css">
</head>
<body>

<div class="sidebar">
    <h2>BizInsight</h2>
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="inventory.html" class="active">📦 Inventory</a>
    <a href="analytics.html">📊 Analytics</a>
    <a href="reports.html">📄 Reports</a>
    <a href="profile.html">👤 Profile</a>
    <a href="index.html" class="lout" onclick="logout()">🚪 Logout</a>
</div>

<div class="main-content">
    <div class="container">

        <h1>Inventory Management</h1>
        <p>Manage your business products efficiently</p>

        <div id="message" role="status"></div>

        <div class="form-container">
            <h3 id="formTitle">Add New Product</h3>

            <form id="productForm">

                <label>Product Name</label>
                <input type="text" id="productName"
                       placeholder="Enter Product Name" required>

                <label>SKU</label>
                <input type="text" id="productSku"
                       placeholder="Enter Unique SKU" required>

                <label>Category</label>
                <input type="text" id="productCategory"
                       placeholder="Enter Category" required>

                <label>Quantity</label>
                <input type="number" id="productStock"
                       placeholder="Enter Quantity" min="0" required>

                <label>Price</label>
                <input type="number" id="productPrice"
                       placeholder="Enter Price" min="0" step="0.01" required>

                <label>Description</label>
                <input type="text" id="productDescription"
                       placeholder="Enter Description">

                <button type="submit" id="submitBtn">Add Product</button>

                <button type="button" id="cancelBtn"
                        onclick="cancelEdit()" hidden>
                    Cancel Edit
                </button>

            </form>
        </div>

        <div class="table-container">

            <h3>Product Inventory</h3>

            <button type="button" onclick="loadProducts()">
                Refresh Inventory
            </button>

            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>SKU</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="productTableBody">
                    <tr>
                        <td colspan="7">Loading products...</td>
                    </tr>
                </tbody>
            </table>

        </div>

    </div>
</div>

<script>
    // --------------------------------
    // API CONFIGURATION
    // --------------------------------

    const API_BASE_URL = "http://localhost:3000/api";
    const PRODUCTS_API = `${API_BASE_URL}/products`;

    // Products with stock at or below this value
    // are displayed as Low Stock.
    const LOW_STOCK_THRESHOLD = 20;

    let editingProductId = null;
    let products = [];

    // --------------------------------
    // AUTHENTICATION
    // --------------------------------

    function getToken() {
        return localStorage.getItem("bizinsight_token");
    }

    function logout() {
        localStorage.removeItem("bizinsight_token");
        localStorage.removeItem("bizinsight_user");
    }

    function getHeaders(includeContentType = false) {
        const token = getToken();

        if (!token) {
            throw new Error("Please login first.");
        }

        const headers = {
            "Authorization": `Bearer ${token}`
        };

        if (includeContentType) {
            headers["Content-Type"] = "application/json";
        }

        return headers;
    }

    // --------------------------------
    // MESSAGE DISPLAY
    // --------------------------------

    function showMessage(message, isError = false) {
        const messageBox = document.getElementById("message");

        messageBox.textContent = message;
        messageBox.style.color = isError ? "red" : "green";
        messageBox.style.margin = "10px 0";
    }

    // --------------------------------
    // SAFE HTML DISPLAY
    // --------------------------------

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[char]);
    }

    // --------------------------------
    // LOAD PRODUCTS
    // --------------------------------

    async function loadProducts() {

        const tableBody = document.getElementById("productTableBody");

        tableBody.innerHTML =
            `<tr><td colspan="7">Loading products...</td></tr>`;

        try {

            const response = await fetch(PRODUCTS_API, {
                method: "GET",
                headers: getHeaders()
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Unable to load products.");
            }

            // Support either an array or { products: [...] }
            products = Array.isArray(data)
                ? data
                : (data.products || []);

            displayProducts();

        } catch (error) {

            tableBody.innerHTML =
                `<tr><td colspan="7">Unable to load products.</td></tr>`;

            showMessage(error.message, true);
        }
    }

    // --------------------------------
    // DISPLAY PRODUCTS
    // --------------------------------

    function displayProducts() {

        const tableBody = document.getElementById("productTableBody");

        if (products.length === 0) {
            tableBody.innerHTML =
                `<tr><td colspan="7">No products found.</td></tr>`;
            return;
        }

        tableBody.innerHTML = products.map(product => {

            const id = product._id || product.id;
            const stock = Number(product.stock) || 0;

            let status;

            if (stock === 0) {
                status = "Out of Stock";
            } else if (stock <= LOW_STOCK_THRESHOLD) {
                status = "Low Stock";
            } else {
                status = "In Stock";
            }

            return `
                <tr>
                    <td>${escapeHTML(product.name)}</td>
                    <td>${escapeHTML(product.sku)}</td>
                    <td>${escapeHTML(product.category)}</td>
                    <td>${stock}</td>
                    <td>₹${Number(product.price).toLocaleString("en-IN")}</td>
                    <td>${status}</td>
                    <td>
                        <button type="button"
                            onclick="editProduct('${escapeHTML(id)}')">
                            Edit
                        </button>

                        <button type="button"
                            onclick="deleteProduct('${escapeHTML(id)}')">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        }).join("");
    }

    // --------------------------------
    // ADD / UPDATE PRODUCT
    // --------------------------------

    document.getElementById("productForm")
        .addEventListener("submit", async function(event) {

        event.preventDefault();

        const product = {
            name: document.getElementById("productName").value.trim(),
            sku: document.getElementById("productSku").value.trim(),
            category: document.getElementById("productCategory").value.trim(),
            stock: Number(document.getElementById("productStock").value),
            price: Number(document.getElementById("productPrice").value),
            description: document.getElementById("productDescription").value.trim()
        };

        if (!product.name || !product.sku || !product.category ||
            !Number.isFinite(product.stock) || product.stock < 0 ||
            !Number.isFinite(product.price) || product.price < 0) {

            showMessage("Please enter valid product details.", true);
            return;
        }

        const submitBtn = document.getElementById("submitBtn");

        submitBtn.disabled = true;

        try {

            const isEditing = editingProductId !== null;

            const url = isEditing
                ? `${PRODUCTS_API}/${encodeURIComponent(editingProductId)}`
                : PRODUCTS_API;

            const response = await fetch(url, {
                method: isEditing ? "PUT" : "POST",
                headers: getHeaders(true),
                body: JSON.stringify(product)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Product operation failed.");
            }

            showMessage(
                isEditing
                    ? "Product updated successfully!"
                    : "Product added successfully!"
            );

            cancelEdit();
            await loadProducts();

        } catch (error) {

            showMessage(error.message, true);

        } finally {
            submitBtn.disabled = false;
        }
    });

    // --------------------------------
    // EDIT PRODUCT
    // --------------------------------

    function editProduct(id) {

        const product = products.find(item =>
            String(item._id || item.id) === String(id)
        );

        if (!product) {
            showMessage("Product not found.", true);
            return;
        }

        editingProductId = id;

        document.getElementById("productName").value = product.name || "";
        document.getElementById("productSku").value = product.sku || "";
        document.getElementById("productCategory").value = product.category || "";
        document.getElementById("productStock").value = product.stock ?? 0;
        document.getElementById("productPrice").value = product.price ?? 0;
        document.getElementById("productDescription").value =
            product.description || "";

        document.getElementById("formTitle").textContent = "Edit Product";
        document.getElementById("submitBtn").textContent = "Update Product";
        document.getElementById("cancelBtn").hidden = false;

        document.getElementById("productForm").scrollIntoView({
            behavior: "smooth"
        });
    }

    // --------------------------------
    // CANCEL EDIT
    // --------------------------------

    function cancelEdit() {

        editingProductId = null;

        document.getElementById("productForm").reset();

        document.getElementById("formTitle").textContent = "Add New Product";
        document.getElementById("submitBtn").textContent = "Add Product";
        document.getElementById("cancelBtn").hidden = true;
    }

    // --------------------------------
    // DELETE PRODUCT
    // --------------------------------

    async function deleteProduct(id) {

        const confirmed = confirm(
            "Are you sure you want to delete this product?"
        );

        if (!confirmed) return;

        try {

            const response = await fetch(
                `${PRODUCTS_API}/${encodeURIComponent(id)}`,
                {
                    method: "DELETE",
                    headers: getHeaders()
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Unable to delete product.");
            }

            showMessage("Product deleted successfully!");

            if (String(editingProductId) === String(id)) {
                cancelEdit();
            }

            await loadProducts();

        } catch (error) {

            showMessage(error.message, true);
        }
    }

    // --------------------------------
    // INITIALIZE INVENTORY
    // --------------------------------

    document.addEventListener("DOMContentLoaded", function() {

        if (!getToken()) {
            showMessage("Session expired. Please login again.", true);
            return;
        }

        loadProducts();
    });

</script>

</body>
</html>
