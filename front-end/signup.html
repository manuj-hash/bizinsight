<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizInsight | Staff invitation required</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .notice{max-width:460px;background:#fff;padding:36px;border-radius:18px;text-align:center;margin:auto;box-shadow:0 10px 25px rgba(0,0,0,.15)}
        .notice p{line-height:1.6}
        .notice a{display:inline-block;margin-top:18px;color:#6a11cb;font-weight:700}
    </style>
</head>
<body>
    <main class="notice">
        <h1>BizInsight</h1>
        <h2>Staff access is invitation-only</h2>
        <p>Public account registration is disabled. Ask your BizInsight administrator to send you a staff invitation. Use the invitation email to activate your account.</p>
        <a href="index.html">Return to sign in</a>
    </main>
</body>
</html>
