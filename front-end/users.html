<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizInsight | User Management</title>
    <link rel="stylesheet" href="inventory.css">
</head>
<body>
<div class="sidebar">
    <h2>BizInsight</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="inventory.html">Inventory</a>
    <a href="orders.html">Sales & Orders</a>
    <a href="customers.html">Customers</a>
    <a href="analytics.html">Analytics</a>
    <a href="reports.html">Reports</a>
    <a href="users.html" class="active">User Management</a>
    <a href="profile.html">Profile</a>
    <a href="index.html" class="lout" id="logoutLink">Logout</a>
</div>
<div class="main-content">
<div class="container">
    <h1>User Management</h1>
    <p>Invite staff and manage administrator/staff access.</p>
    <p id="message" role="status" aria-live="polite"></p>

    <section class="form-container">
        <h3>Invite a staff member</h3>
        <form id="inviteForm">
            <label for="fullName">Full name</label>
            <input id="fullName" maxlength="150" required>
            <label for="email">Email address</label>
            <input id="email" type="email" maxlength="254" required>
            <label for="phone">Phone (optional)</label>
            <input id="phone" type="tel" maxlength="30">
            <button type="submit" id="inviteButton">Send invitation</button>
        </form>
    </section>

    <section class="table-container">
        <h3>BizInsight users</h3>
        <button type="button" id="refreshButton">Refresh users</button>
        <div style="overflow-x:auto">
            <table>
                <thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Account ID</th><th>Action</th></tr></thead>
                <tbody id="usersBody"><tr><td colspan="5">Loading users...</td></tr></tbody>
            </table>
        </div>
    </section>
</div>
</div>
<script>
const API="/api";
const token=()=>sessionStorage.getItem("bizinsight_token");
const currentUser=JSON.parse(sessionStorage.getItem("bizinsight_user")||"{}");
function headers(json=false){
    if(!token())throw new Error("Your session has expired. Please sign in again.");
    const h={Authorization:"Bearer "+token()};
    if(json)h["Content-Type"]="application/json";
    return h;
}
function showMessage(message,error=false){
    const box=document.getElementById("message");box.textContent=message;
    box.style.color=error?"#b42318":"#16794b";
}
async function api(path,options={}){
    const response=await fetch(API+path,{...options,headers:{...headers(Boolean(options.body)),...(options.headers||{})}});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.message||"Request failed");
    return data;
}
async function loadUsers(){
    const body=document.getElementById("usersBody");
    try{
        const users=await api("/users");
        body.replaceChildren();
        if(!users.length){body.innerHTML='<tr><td colspan="5">No user profiles found.</td></tr>';return;}
        users.forEach(user=>{
            const row=body.insertRow();
            const cell=value=>{const td=row.insertCell();td.textContent=value==null?"—":String(value);return td;};
            cell(user.full_name);cell(user.phone);cell(user.role);cell(String(user.id).slice(0,8)+"…");
            const actions=row.insertCell();
            const select=document.createElement("select");
            select.add(new Option("Staff","staff"));
            select.add(new Option("Admin","admin"));
            select.value=user.role;
            select.disabled=user.id===currentUser.id;
            const save=document.createElement("button");
            save.type="button";save.textContent="Save role";
            save.disabled=select.disabled;
            save.addEventListener("click",async()=>{
                if(!confirm("Change this user's role to "+select.value+"?"))return;
                try{
                    const result=await api("/users/"+encodeURIComponent(user.id)+"/role",{
                        method:"PATCH",body:JSON.stringify({role:select.value})
                    });
                    showMessage(result.message||"Role updated.");
                    await loadUsers();
                }catch(error){showMessage(error.message,true);}
            });
            actions.append(select,document.createTextNode(" "),save);
        });
    }catch(error){
        body.innerHTML='<tr><td colspan="5">Unable to load users. This page is restricted to administrators.</td></tr>';
        showMessage(error.message,true);
    }
}
document.getElementById("inviteForm").addEventListener("submit",async event=>{
    event.preventDefault();
    const button=document.getElementById("inviteButton");button.disabled=true;
    try{
        const result=await api("/users/invite",{method:"POST",body:JSON.stringify({
            full_name:document.getElementById("fullName").value.trim(),
            email:document.getElementById("email").value.trim(),
            phone:document.getElementById("phone").value.trim()
        })});
        showMessage(result.message||"Invitation sent.");
        document.getElementById("inviteForm").reset();
        await loadUsers();
    }catch(error){showMessage(error.message,true);}
    finally{button.disabled=false;}
});
document.getElementById("refreshButton").addEventListener("click",loadUsers);
document.getElementById("logoutLink").addEventListener("click",()=>{
    sessionStorage.clear();localStorage.removeItem("bizinsight_token");localStorage.removeItem("bizinsight_user");
});
document.addEventListener("DOMContentLoaded",()=>{
    if(!token()){window.location.href="index.html";return;}
    if(currentUser.role!=="admin"){
        showMessage("User management is available to administrators only.",true);
        document.getElementById("inviteForm").hidden=true;
        return;
    }
    loadUsers();
});
</script>
</body>
</html>
