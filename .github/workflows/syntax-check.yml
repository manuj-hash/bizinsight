name: BizInsight syntax checks

on:
  push:
    branches: [main, improvements/phase-1, fix/permission-boundary-and-integration]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: node scripts/check-syntax.js
      - name: Audit production dependencies
        run: npm audit --prefix backend --omit=dev --audit-level=moderate
      - name: Report dependency audit summary
        continue-on-error: true
        run: |
          npm audit --prefix backend --json > /tmp/bizinsight-audit.json || true
          node -e "const a=require('/tmp/bizinsight-audit.json'); console.log('Dependency audit summary:', JSON.stringify(a.metadata?.vulnerabilities || {})); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log(name + ': ' + v.severity + ', direct=' + v.isDirect + ', fix=' + JSON.stringify(v.fixAvailable));"
